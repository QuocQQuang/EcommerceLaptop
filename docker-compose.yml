  #     networks:
  #       - ecommerce_network

  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ecommerce_network

  #   api:
  #     build: 
  #       context: .
  #       dockerfile: src/EcommerceLaptop.API/Dockerfile
  #     container_name: ecommerce_api
  #     ports:
  #       - "5000:8080"
  #     environment:
  #       - ASPNETCORE_ENVIRONMENT=Development
  #       - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=EcommerceLaptop;User Id=sa;Password=Your_password123;TrustServerCertificate=true;
  #       - ConnectionStrings__Redis=redis:6379
  #       - VectorDb__Endpoint=http://qdrant:6333
  #     depends_on:
  #       - sqlserver
  #       - redis
  #       - qdrant
  #     networks:
  #       - ecommerce_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ecommerce_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ecommerce_network

  prometheus:
    image: prom/prometheus:latest
    container_name: ecommerce_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - ecommerce_network

  grafana:
    image: grafana/grafana:latest
    container_name: ecommerce_grafana
    ports:
      - "3100:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - ecommerce_network

volumes:
  sqlserver_data:
  redis_data:
  qdrant_data:


networks:
  ecommerce_network:
    driver: bridge
